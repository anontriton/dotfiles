# More option see https://github.com/DreamMaoMao/mango/wiki/

# exec once
exec-once=mangobar
exec-once=lxqt-policykit-agent
exec-once=wl-clip-persist --clipboard regular
exec-once=wl-paste --type text --watch cliphist store
exec-once=fnott
exec-once=swaybg -i /home/iverson/wallpapers/rei.jpg -m fill

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=200
animation_duration_tag=175
animation_duration_close=250
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=20
cursor_theme=Bibata-Original-Amber
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us
xkb_rules_options=ctrl:nocaps

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=1
# Catppuccin Mocha
rootcolor=0x1e1e2eff
bordercolor=0x45475aff
dropcolor=0xa6e3a155
splitcolor=0xcba6f7ff
focuscolor=0xfab387ff
maximizescreencolor=0xa6e3a1ff
urgentcolor=0xf38ba8ff
scratchpadcolor=0x89b4faff
globalcolor=0xcba6f7ff
overlaycolor=0x94e2d5ff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,fuzzel
bind=Alt,Return,spawn,foot

# scratchpad
bind=ALT+SHIFT,Return,toggle_named_scratchpad,scratchpad,none,foot -a scratchpad
windowrule=isnamedscratchpad:1,width:1100,height:750,appid:scratchpad
# nnn preview window: never takes focus, so keys stay in nnn
windowrule=nofocus:1,appid:preview-tui

# exit
bind=SUPER+SHIFT,m,quit
bind=ALT,q,killclient
bind=SUPER,Escape,spawn,swaylock

# clipboard
bind=SUPER,v,spawn,cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# screenshot
bind=NONE,Print,spawn_shell,mkdir -p ~/pictures/screenshots && f=~/pictures/screenshots/$(date +%Y%m%d-%H%M%S).png && grim "$f" && wl-copy < "$f"
bind=SHIFT,Print,spawn_shell,mkdir -p ~/pictures/screenshots && f=~/pictures/screenshots/$(date +%Y%m%d-%H%M%S).png && grim -g "$(slurp)" "$f" && wl-copy < "$f"

# switch window focus
bind=ALT+SHIFT,Tab,focusstack,next
bind=CTRL+ALT,h,focusdir,left
bind=CTRL+ALT,l,focusdir,right
bind=CTRL+ALT,k,focusdir,up
bind=CTRL+ALT,j,focusdir,down

# swap window
bind=CTRL+ALT+SHIFT,k,exchange_client,up
bind=CTRL+ALT+SHIFT,j,exchange_client,down
bind=CTRL+ALT+SHIFT,h,exchange_client,left
bind=CTRL+ALT+SHIFT,l,exchange_client,right

# switch window status
bind=ALT+SHIFT,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT+SHIFT,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad

# scroller layout
#bind=ALT,e,set_proportion,1.0
#bind=ALT,x,switch_proportion_preset,
#bind=alt+super+ctrl,h,scroller_stack,left
#bind=alt+super+ctrl,l,scroller_stack,right
#bind=alt+super+ctrl,k,scroller_stack,up
#bind=alt+super+ctrl,j,scroller_stack,down

#dwindle layout(manual split mode)
#bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=ALT+SHIFT,n,switch_layout

# tag switch
bind=SUPER,h,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,l,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,h,tagtoleft,0
#bind=CTRL+SUPER,l,tagtoright,0

bind=Alt,1,view,1,0
bind=Alt,2,view,2,0
bind=Alt,3,view,3,0
bind=Alt,4,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
bind=Alt,8,view,8,0
bind=Alt,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=Alt+SHIFT,1,tag,1,0
bind=Alt+SHIFT,2,tag,2,0
bind=Alt+SHIFT,3,tag,3,0
bind=Alt+SHIFT,4,tag,4,0
bind=Alt+SHIFT,5,tag,5,0
bind=Alt+SHIFT,6,tag,6,0
bind=Alt+SHIFT,7,tag,7,0
bind=Alt+SHIFT,8,tag,8,0
bind=Alt+SHIFT,9,tag,9,0

# monitor switch
#bind=SUPER+Alt,h,tagmon,left
#bind=SUPER+Alt,l,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,c,togglegaps

# movewin
#bind=CTRL+SHIFT,k,movewin,+0,-50
#bind=CTRL+SHIFT,j,movewin,+0,+50
#bind=CTRL+SHIFT,h,movewin,-50,+0
#bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=ALT+SHIFT,k,resizewin,+0,-50
bind=ALT+SHIFT,j,resizewin,+0,+50
bind=ALT+SHIFT,h,resizewin,-50,+0
bind=ALT+SHIFT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%

# volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
