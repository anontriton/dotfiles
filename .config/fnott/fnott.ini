# Catppuccin Mocha, matched to mango (1px border, 6px radius, 10px outer gaps)
anchor=top-right
stacking-order=top-down
edge-margin-vertical=10
edge-margin-horizontal=10
notification-margin=5
min-width=300
max-width=400
max-icon-size=32
selection-helper=fuzzel --dmenu
dpi-aware=no

layer=overlay
background=1e1e2ef2
border-color=fab387ff
border-radius=6
border-size=1
padding-vertical=12
padding-horizontal=14

title-font=Hack Nerd Font:size=9
title-color=6c7086ff
title-format=%a%A
summary-font=Hack Nerd Font:weight=bold:size=10
summary-color=cdd6f4ff
summary-format=<b>%s</b>\n
body-font=Hack Nerd Font:size=10
body-color=bac2deff
body-format=%b
progress-bar-height=6
progress-color=fab387ff

default-timeout=5
idle-timeout=0

[low]
border-color=585b70ff
summary-color=bac2deff
body-color=6c7086ff
default-timeout=3

[normal]

[critical]
border-color=f38ba8ff
summary-color=f38ba8ff
default-timeout=0
