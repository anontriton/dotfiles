[main]
font=Hack Nerd Font:size=10
prompt="  "
placeholder=Search…
icons-enabled=no
terminal=foot -e
match-counter=yes
width=45
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=18
layer=overlay
anchor=center
dpi-aware=auto

[colors]
# Catppuccin Mocha
background=1e1e2eff
text=cdd6f4ff
prompt=f38ba8ff
placeholder=6c7086ff
input=cdd6f4ff
match=f38ba8ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=f38ba8ff
counter=6c7086ff

[border]
width=1
radius=0

[key-bindings]
# vim-style: Ctrl+j/k move, Ctrl+d/u page
next=Down Control+n Control+j
prev=Up Control+p Control+k
next-page=Page_Down KP_Page_Down Control+d
prev-page=Page_Up KP_Page_Up Control+u
# freed from Ctrl+k / Ctrl+d / Ctrl+u above
delete-line-forward=none
delete-next=Delete KP_Delete
delete-line-backward=none
